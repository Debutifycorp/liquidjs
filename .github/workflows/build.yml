name: Build
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      bundles:
        required: false
        type: string
env:
  BUNDLES: ${{ inputs.bundles }}
jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.os }}
          path: dist
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: npm-logs-${{ inputs.os }}
          path: ~/.npm/_logs
