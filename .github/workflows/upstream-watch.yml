name: Upstream watch
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare with the latest liquidjs release and advisories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(node -p "require('./package.json').upstreamLiquidjs")
          latest=$(npm view liquidjs version)
          advisories=$(gh api /repos/harttle/liquidjs/security-advisories --jq '[.[] | select(.state=="published") | .ghsa_id] | join(", ")' || echo "lookup failed")
          echo "base=$base latest=$latest"
          if [ "$base" != "$latest" ]; then
            title="Upstream liquidjs $latest is out (fork is on $base)"
            if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "Merge upstream \`v$latest\` into \`master\`: run \`git fetch upstream --tags\`, then \`git merge v$latest\`. On conflicts keep ours for the top of \`CHANGELOG.md\` and for \`version\` in \`package.json\`. Set \`upstreamLiquidjs\` in \`package.json\` to \`$latest\`, or \`perf:diff\` keeps benchmarking against the old release and this watch reopens the issue every week. Drop upstream's \`package-lock.json\` changes (\`git rm package-lock.json\`), regenerate \`pnpm-lock.yaml\` with \`pnpm install\`, run \`pnpm test\` and the liquid-spec workflow, then release. Published advisories on liquidjs: ${advisories:-none}."
            fi
          fi
