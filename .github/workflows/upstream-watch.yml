name: Upstream watch
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare with the latest liquidjs release and advisories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(node -p "require('./package.json').upstreamLiquidjs")
          latest=$(npm view liquidjs version)
          advisories=$(gh api /repos/harttle/liquidjs/security-advisories --jq '[.[] | select(.state=="published") | .ghsa_id] | join(", ")' || echo "lookup failed")
          echo "base=$base latest=$latest"
          if [ "$base" != "$latest" ]; then
            title="Upstream liquidjs $latest is out (fork is on $base)"
            if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "Merge upstream \`v$latest\` into \`master\`: run \`git fetch upstream --tags\`, then \`git merge v$latest\`. On conflicts keep ours for the top of \`CHANGELOG.md\` and for \`version\` in \`package.json\`. Set \`upstreamLiquidjs\` in \`package.json\` to \`$latest\`, or \`perf:diff\` keeps benchmarking against the old release and this watch reopens the issue every week. Drop upstream's \`package-lock.json\` changes (\`git rm package-lock.json\`), regenerate \`pnpm-lock.yaml\` with \`pnpm install\`. The fork's tooling has diverged from upstream's (dependency upgrade plan, 2026-10-13): on conflicts in \`package.json\` keep ours for \`devDependencies\`, \`scripts\` and \`engines\` and add any new upstream devDependency at its latest version; keep ours for \`rollup.config.mjs\` and port upstream's bundle changes into it; \`.eslintrc.json\`, \`.eslintignore\`, \`test/.eslintrc.json\`, \`test/e2e/.eslintrc.json\`, \`bin/.eslintrc.json\`, \`benchmark/.eslintrc.json\` and \`libs.d.ts\` stay deleted, with upstream's rule changes ported into \`eslint.config.mjs\`; run \`pnpm exec eslint --fix\` on the merged files (the flat config also checks TypeScript-only syntax) and \`pnpm exec tsc --noEmit -p tsconfig.json\`; a new spec that uses \`sinon.fakeServer\` or \`sinon.useFakeXMLHttpRequest\` takes them from \`nise\`; a new spec that imports \`jsdom\` gets \`JSDOM\` and \`VirtualConsole\` from \`globalThis\` under the \`@jest-environment ./test/support/jsdom-environment.cjs\` docblock, as \`src/build/fs-impl-browser.spec.ts\` does; the commit-message check in CI lints every pushed commit, upstream's included, so if one of them fails \`commitlint\`, relax the rule in \`commitlint.config.js\` instead of rewriting history. Then run \`pnpm test\` and the liquid-spec workflow, then release. Published advisories on liquidjs: ${advisories:-none}."
            fi
          fi
