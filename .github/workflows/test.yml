name: Test
on: [workflow_dispatch, workflow_call]
jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest]
        timezone: [Etc/GMT, Asia/Shanghai, America/New_York]
        node-version: [24]
        include:
          - os: ubuntu-latest
            timezone: Etc/GMT
            node-version: 26
          - os: macos-latest
            timezone: America/New_York
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - name: Run Test
        run: TZ=${{ matrix.timezone }} pnpm test
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-npm-logs-${{ matrix.os }}-${{ matrix.node-version }}
          path: ~/.npm/_logs
  demo:
    name: Demo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-ubuntu-latest
          path: dist
      - name: Run Demo Test
        run: pnpm run test:demo
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-npm-logs
          path: ~/.npm/_logs
