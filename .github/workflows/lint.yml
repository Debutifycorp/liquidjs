name: Lint
on: [workflow_dispatch, workflow_call]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # a pull request: its own commits; a push: the pushed commits (the all-zero or unknown `before` of a new or force-pushed branch falls back to the last commit); otherwise the last commit
          if [ "$EVENT" = pull_request ]; then
            pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          elif [ "$EVENT" = push ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            pnpm exec commitlint --last --verbose
          fi
      - name: Archive npm failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: npm-logs
          path: ~/.npm/_logs
